function getTier(km,tiers){var k=Number(km)||0;return tiers.find(function(t){return k>=t.min&&k<t.max;})||tiers[tiers.length-1];}
function calcTrip(jarak,ok,alasan,cfg){var t=getTier(jarak,cfg.tiers);return{tierId:t.id,tierLabel:t.label,insentifTrip:t.trip,insentifUnit:ok?t.unit:0,penalti:!ok&&!(alasan||'').trim()?cfg.penaltiGagal:0};}

            )

        h(Btn,{primary:true,full:true,onClick:masuk,disabled:logging,style:{padding:'11px'}},logging?h(F,null,h(Spin),'Masuk...'):role==='runner'?'Masuk sebagai Runner →':'Masuk sebagai Admin →'),

  return h('div',{style:{display:'flex',flexDirection:'column',minHeight:'100vh'}},
    h('div',{style:{background:'#0F6E56',padding:'10px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',{style:{fontSize:15,fontWeight:500,color:'#fff'}},'📱 DeviceStore Admin'),
      h('button',{onClick:props.onLogout,style:{padding:'5px 12px',borderRadius:6,background:'#C0392B',border:'none',color:'#fff',fontSize:12,fontWeight:500,cursor:'pointer'}},'Keluar')
    ),
    h('div',{style:{display:'flex',gap:2,padding:'8px 12px',background:'#f5f4ef',borderBottom:'0.5px solid #ddd',overflowX:'auto'}},
      ATABS.map(function(n){return h('button',{key:n.id,onClick:function(){setView(n.id);},style:{display:'flex',alignItems:'center',gap:4,padding:'6px 10px',borderRadius:6,border:'none',cursor:'pointer',whiteSpace:'nowrap',fontSize:12,background:view===n.id?'#fff':'transparent',fontWeight:view===n.id?500:400,color:view===n.id?'#0F6E56':'#888'}},n.i,' ',n.l);})
    ),
    h('div',{style:{flex:1,padding:'16px',overflowY:'auto'}},
      view==='dashboard'&&h(AdminDash,{trips:props.trips,runners:props.runners,config:props.config,accounts:props.accounts}),
      view==='trips'&&h(AdminTrips,{trips:props.trips,runners:props.runners}),
      view==='salary'&&h(AdminSal,{trips:props.trips,runners:props.runners,config:props.config}),
      view==='runners'&&h(AdminRunners,{accounts:props.accounts,onUpdateStatus:props.onUpdateRunnerStatus}),
      view==='settings'&&h(AdminSettings,{config:props.config,runners:props.runners,onSaveConfig:props.onSaveConfig,onSaveRunners:props.onSaveRunners})
    )
  );
}

// ── ROOT ───────────────────────────────────────────────────────────────────────
function App(){
  var s1=useState('login'),screen=s1[0],setScreen=s1[1];
  var s2=useState(null),user=s2[0],setUser=s2[1];
  var s3=useState(function(){return sg('ds-config',DEF_CFG);}),config=s3[0],setConfig=s3[1];
  var s4=useState([]),runners=s4[0],setRunners=s4[1];
  var s5=useState(function(){return sg('ds-trips',[]);}),trips=s5[0],setTrips=s5[1];
  var s6=useState([]),accounts=s6[0],setAccounts=s6[1];
  var s7=useState(''),regOk=s7[0],setRegOk=s7[1];

  useEffect(function(){
    var accs=sg('ds-runner-accounts',[]);
    var hasPerm=accs.find(function(a){return a.id===PERM_ID;});
    if(!hasPerm){
      var perm={id:PERM_ID,nama:'Akhmad Syarifuddin',email:ADMIN_EMAIL,password:ADMIN_PASS,alamat:'-',telepon:'-',selfie:'',ktp:'',kontakDarurat:{nama:'-',telepon:'-'},status:'active',permanent:true,createdAt:new Date().toISOString()};
      accs=[perm].concat(accs);
    }
    accs=accs.map(function(a){if(a.id!==PERM_ID)return a;return Object.assign({},a,{email:ADMIN_EMAIL,password:ADMIN_PASS,permanent:true});});
    ss('ds-runner-accounts',accs);
    var names=accs.filter(function(a){return a.status==='active';}).map(function(a){return a.nama;});
    ss('ds-runners',names);
    setAccounts(accs);setRunners(names);
  },[]);

  function syncR(accs){var names=accs.filter(function(a){return a.status==='active';}).map(function(a){return a.nama;});setRunners(names);ss('ds-runners',names);}
  function addTrip(form){var calc=calcTrip(form.jarak,form.unitBerhasil,form.alasanGagal,config);var nxt=[Object.assign({},form,calc,{id:Date.now()})].concat(trips);setTrips(nxt);ss('ds-trips',nxt);}
  function updRunner(id,status){var nxt=accounts.map(function(x){return x.id===id?Object.assign({},x,{status:status}):x;});setAccounts(nxt);ss('ds-runner-accounts',nxt);syncR(nxt);}
  function saveConfig(cfg){setConfig(cfg);ss('ds-config',cfg);}
  function saveRunners(r){setRunners(r);ss('ds-runners',r);}

  if(screen==='register')return h(RegisterPage,{onBack:function(){setScreen('login');},onRegistered:function(nama){var accs=sg('ds-runner-accounts',[]);setAccounts(accs);syncR(accs);setRegOk(nama);setScreen('login');}});
  if(screen==='login')return h('div',null,regOk&&h('div',{style:{padding:'10px 16px',background:'#E1F5EE',fontSize:13,color:'#0F6E56',textAlign:'center',borderBottom:'0.5px solid #9FE1CB'}},'✓ Pendaftaran '+regOk+' berhasil! Silakan masuk.'),h(Login,{onLogin:function(role,name){setUser({role:role,name:name});setScreen('app');setRegOk('');},onRegister:function(){setScreen('register');}}));
  if(!user)return null;
  if(user.role==='runner')return h(RunnerApp,{name:user.name,config:config,trips:trips,onAdd:addTrip,onLogout:function(){setUser(null);setScreen('login');}});
  return h(AdminApp,{config:config,runners:runners,trips:trips,accounts:accounts,onUpdateRunnerStatus:updRunner,onSaveConfig:saveConfig,onSaveRunners:saveRunners,onLogout:function(){setUser(null);setScreen('login');}});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
