function hav(la1,lo1,la2,lo2){const R=6371,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*10)/10;}
function getTier(km,tiers){const k=Number(km)||0;return tiers.find(t=>k>=t.min&&k<t.max)||tiers[tiers.length-1];}
function calcTrip(jarak,ok,alasan,cfg){const t=getTier(jarak,cfg.tiers);return{tierId:t.id,tierLabel:t.label,insentifTrip:t.trip,insentifUnit:ok?t.unit:0,penalti:!ok&&!(alasan||'').trim()?cfg.penaltiGagal:0};}
function calcSal(rt,cfg){const hA=new Set(rt.map(t=>t.tanggal)).size,iT=rt.reduce((s,t)=>s+(t.insentifTrip||0),0),iU=rt.reduce((s,t)=>s+(t.insentifUnit||0),0),pen=rt.reduce((s,t)=>s+(t.penalti||0),0),tm=hA*cfg.tunjanganMakan,bpjs=Math.round(cfg.gajiPokok*cfg.bpjsRate/100);return{hariAktif:hA,tunjanganMakan:tm,insentifTrip:iT,insentifUnit:iU,penalti:pen,bpjs,total:cfg.gajiPokok+tm+iT+iU-pen-bpjs};}

async function resizeImg(file,mW=360,q=0.72){return new Promise(res=>{const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas'),ratio=Math.min(mW/img.width,mW/img.height,1);cv.width=Math.round(img.width*ratio);cv.height=Math.round(img.height*ratio);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q));};img.src=ev.target.result;};r.readAsDataURL(file);});}

// ─── COD PAGE 1 ───────────────────────────────────────────────────────────────
function CodP1({form,setForm,config,onNext}){

  const calc=form.jarak?calcTrip(form.jarak,form.unitBerhasil,form.alasanGagal,config):null;

function App(){
  const[screen,setScreen]=useState('login');const[user,setUser]=useState(null);

  const[runners,setRunners]=useState([]);

  const[accounts,setAccounts]=useState([]);
  const[regOk,setRegOk]=useState('');

  useEffect(()=>{
    let accs=sg('ds-runner-accounts',[]);

    accs=accs.map(a=>a.id===PERM.id?{...a,email:PERM.email,password:PERM.password,permanent:true}:a);
    ss('ds-runner-accounts',accs);
    const names=accs.filter(a=>a.status==='active').map(a=>a.nama);ss('ds-runners',names);

  },[]);

  const syncR=(accs)=>{const names=accs.filter(a=>a.status==='active').map(a=>a.nama);setRunners(names);ss('ds-runners',names);};
  const addTrip=(form)=>{const calc=calcTrip(form.jarak,form.unitBerhasil,form.alasanGagal,config);const next=[{...form,...calc,id:Date.now()},...trips];setTrips(next);ss('ds-trips',next);};

  const saveConfig=(cfg)=>{setConfig(cfg);ss('ds-config',cfg);};
  const saveRunners=(r)=>{setRunners(r);ss('ds-runners',r);};

  if(screen==='register')return e(RegisterPage,{onBack:()=>setScreen('login'),onRegistered:nama=>{const accs=sg('ds-runner-accounts',[]);setAccounts(accs);syncR(accs);setRegOk(nama);setScreen('login');}});
  if(screen==='login')return e('div',null,regOk&&e('div',{style:{padding:'10px 16px',background:'#E1F5EE',fontSize:13,color:'#0F6E56',textAlign:'center',borderBottom:'0.5px solid #9FE1CB'}},`✓ Pendaftaran ${regOk} berhasil! Silakan masuk.`),e(Login,{onLogin:(role,name)=>{setUser({role,name});setScreen('app');setRegOk('');},onRegister:()=>setScreen('register')}));

}
