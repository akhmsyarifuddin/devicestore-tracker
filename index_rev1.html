// ── OTP ─────────────────────────────────────────────
var _otp=null;
function genOTP(){return String(Math.floor(100000+Math.random()*900000));}
function startOTP(email){var c=genOTP();_otp={code:c,expiry:Date.now()+180000,email:email};return c;}
function checkOTP(code){if(!_otp)return'OTP tidak ditemukan.';if(Date.now()>_otp.expiry){_otp=null;return'OTP expired. Kirim ulang.';}if(code.trim()!==_otp.code){return'Kode OTP salah.';}  _otp=null;return'';}
function otpSecsLeft(){if(!_otp)return 0;return Math.max(0,Math.round((_otp.expiry-Date.now())/1000));}
function sendOTPEmail(email,name,code,onDone,onFail){
  loadEmailJS(function(){
    if(!window.emailjs||EJ_KEY==='YOUR_PUBLIC_KEY'){
      setTimeout(function(){alert('🔑 TEST MODE\nKode OTP: '+code+'\nEmail: '+email+'\n\n(Setup EmailJS di Settings untuk kirim email sungguhan)');onDone();},300);
      return;
    }
    window.emailjs.send(EJ_SVC,EJ_TPL,{to_email:email,to_name:name,otp_code:code})
      .then(function(){onDone();})
      .catch(function(){onFail('Gagal kirim OTP. Coba lagi.');});
  });
}

// ── MAP PICKER (loads Leaflet lazily) ─────────────────
function MapPicker(p){
  var divRef=useRef(null);
  var mapRef=useRef(null);
  var mkRef=useRef(null);
  var s1=useState(false);var loaded=s1[0];var setLoaded=s1[1];

  function initMap(){
    if(!divRef.current||mapRef.current)return;
    var lat=p.lat&&!isNaN(Number(p.lat))?Number(p.lat):-6.2088;
    var lng=p.lng&&!isNaN(Number(p.lng))?Number(p.lng):106.8456;
    var zoom=(p.lat&&!isNaN(Number(p.lat)))?15:12;
    var map=window.L.map(divRef.current,{scrollWheelZoom:true}).setView([lat,lng],zoom);
    mapRef.current=map;
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
    var mk=window.L.marker([lat,lng],{draggable:true}).addTo(map);
    mkRef.current=mk;
    function update(ll){
      mk.setLatLng(ll);
      p.onChange(parseFloat(ll.lat.toFixed(6)),parseFloat(ll.lng.toFixed(6)));
    }
    map.on('click',function(e){update(e.latlng);});
    mk.on('dragend',function(){update(mk.getLatLng());});
    setTimeout(function(){if(mapRef.current)mapRef.current.invalidateSize();},200);
  }

  useEffect(function(){
    if(!window.L){
      var link=document.createElement('link');link.rel='stylesheet';link.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(link);
      var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      sc.onload=function(){setLoaded(true);setTimeout(initMap,100);};
      document.head.appendChild(sc);
    }else{setLoaded(true);setTimeout(initMap,100);}
    return function(){if(mapRef.current){mapRef.current.remove();mapRef.current=null;}};
  },[]);

  return h('div',null,
    h('div',{id:'map-container',ref:divRef,style:{height:260,borderRadius:8,border:'0.5px solid #ccc',marginTop:10,background:'#e8e8e8',display:'flex',alignItems:'center',justifyContent:'center'}},
      !loaded?h('div',{style:{fontSize:12,color:'#888'}},'Memuat peta...'):null
    ),
    h('div',{style:{fontSize:11,color:'#888',marginTop:5,textAlign:'center'}},'Klik peta atau drag pin untuk pilih lokasi')
  );
}

// ── OTP BOX ───────────────────────────────────────────
function OTPBox(p){
  var initSec=otpSecsLeft()||180;
  var s1=useState(initSec);var sec=s1[0];var setSec=s1[1];
  var s2=useState('');var otp=s2[0];var setOtp=s2[1];
  var s3=useState(59);var rsec=s3[0];var setRsec=s3[1];
  var s4=useState('');var err=s4[0];var setErr=s4[1];
  var s5=useState(false);var sending=s5[0];var setSending=s5[1];

  useEffect(function(){
    var iv=setInterval(function(){
      setSec(function(t){return Math.max(0,t-1);});
      setRsec(function(t){return Math.max(0,t-1);});
    },1000);
    return function(){clearInterval(iv);};
  },[]);

  function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

  function verify(){
    if(sec<=0){setErr('OTP sudah expired. Kirim ulang.');return;}
    var r=checkOTP(otp);
    if(r){setErr(r);return;}
    p.onVerified();
  }

  function resend(){
    if(rsec>0||sending)return;
    setSending(true);setErr('');
    var code=startOTP(p.email);
    sendOTPEmail(p.email,p.name,code,
      function(){setSending(false);setSec(180);setRsec(59);setOtp('');},
      function(e){setSending(false);setErr(e);}
    );
  }

  return h(Card,{className:'fi'},
    h('div',{style:{textAlign:'center',marginBottom:16}},
      h('div',{style:{fontSize:38,marginBottom:8}},'📧'),
      h('div',{style:{fontSize:15,fontWeight:500}},'Verifikasi Email'),
      h('div',{style:{fontSize:12,color:'#888',marginTop:4}},'Kode OTP dikirim ke'),
      h('div',{style:{fontSize:13,fontWeight:500,color:'#0F6E56',marginTop:2}},p.email)

    EJ_KEY==='YOUR_PUBLIC_KEY'?h('div',{style:{background:'#FAEEDA',borderRadius:8,padding:'8px 12px',fontSize:11,color:'#633806',marginBottom:12,textAlign:'center'}},'ℹ Test Mode — OTP muncul sebagai pop-up notifikasi'):null,
    h('div',{style:{textAlign:'center',marginBottom:14}},
      h('div',{style:{fontSize:11,color:'#888',marginBottom:4}},sec>0?'Berlaku hingga':'OTP sudah expired'),
      h('div',{style:{fontSize:30,fontWeight:500,fontFamily:'monospace',color:sec<=60?(sec<=0?'#A32D2D':'#BA7517'):'#0F6E56'}},fmt(sec))
    ),
    err?h(Toast,{msg:err,type:'e'}):null,
    h('div',{style:{marginBottom:14}},
      h(Lbl,{req:true},'Kode OTP (6 digit)'),
      h(Inp,{type:'text',inputMode:'numeric',maxLength:6,placeholder:'- - - - - -',value:otp,onChange:function(ev){setOtp(ev.target.value.replace(/[^0-9]/g,'').slice(0,6));},onKeyDown:function(ev){if(ev.key==='Enter')verify();},style:{fontSize:22,textAlign:'center',letterSpacing:10,fontFamily:'monospace',padding:'14px'}})
    ),
    h(Btn,{primary:true,full:true,onClick:verify,disabled:otp.length<6||sec<=0,style:{padding:'12px',marginBottom:12}},'Verifikasi OTP ✓'),
    h('div',{style:{textAlign:'center',fontSize:12,color:'#888',marginBottom:p.onBack?8:0}},
      rsec>0?h('span',null,'Kirim ulang dalam ',h('b',null,rsec+'s')):
      h('button',{onClick:resend,disabled:sending,type:'button',style:{background:'none',border:'none',color:sending?'#aaa':'#0F6E56',cursor:sending?'default':'pointer',fontSize:12,fontWeight:500,padding:0}},sending?h(F,null,h(Spin),'Mengirim...'):'↩ Kirim ulang OTP')
    ),
    p.onBack?h('button',{onClick:p.onBack,type:'button',style:{display:'block',width:'100%',textAlign:'center',background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:12,marginTop:6}},'← Kembali'):null

}

function App(){
  var s1=useState('login');var screen=s1[0];var setScreen=s1[1];
  var s2=useState(null);var user=s2[0];var setUser=s2[1];
  var s3=useState(function(){return sg('ds-config',DEF_CFG);});var config=s3[0];var setConfig=s3[1];
  var s4=useState([]);var runners=s4[0];var setRunners=s4[1];
  var s5=useState(function(){return sg('ds-trips',[]);});var trips=s5[0];var setTrips=s5[1];
  var s6=useState([]);var accounts=s6[0];var setAccounts=s6[1];
  var s7=useState('');var notify=s7[0];var setNotify=s7[1];

  useEffect(function(){
    var accs=sg('ds-runner-accounts',[]);
    var hasPerm=false;for(var i=0;i<accs.length;i++){if(accs[i].id===PERM_ID){hasPerm=true;break;}}
    if(!hasPerm){var perm={id:PERM_ID,nama:'Akhmad Syarifuddin',email:ADMIN_EMAIL,password:ADMIN_PASS,alamat:'-',telepon:'-',selfie:'',ktp:'',kontakDarurat:{nama:'-',telepon:'-'},status:'active',permanent:true,createdAt:new Date().toISOString()};accs=[perm].concat(accs);}
    accs=accs.map(function(a){if(a.id!==PERM_ID)return a;return merge(a,{email:ADMIN_EMAIL,password:ADMIN_PASS,permanent:true});});
    ss('ds-runner-accounts',accs);
    var names=[];for(var j=0;j<accs.length;j++){if(accs[j].status==='active')names.push(accs[j].nama);}
    ss('ds-runners',names);
    setAccounts(accs);setRunners(names);
  },[]);

  function syncR(accs){var names=[];for(var i=0;i<accs.length;i++){if(accs[i].status==='active')names.push(accs[i].nama);}setRunners(names);ss('ds-runners',names);}
  function addTrip(form){var calc=calcTrip(form.jarak,form.unitBerhasil,form.alasanGagal,config);var nxt=[merge({},form,calc,{id:Date.now()})].concat(trips);setTrips(nxt);ss('ds-trips',nxt);}
  function updRunner(id,status){var nxt=accounts.map(function(x){return x.id===id?merge(x,{status:status}):x;});setAccounts(nxt);ss('ds-runner-accounts',nxt);syncR(nxt);}
  function saveConfig(cfg){setConfig(cfg);ss('ds-config',cfg);}
  function saveRunners(r){setRunners(r);ss('ds-runners',r);}

  if(screen==='register')return h(RegisterPage,{onBack:function(){setScreen('login');},onRegistered:function(nama){var accs=sg('ds-runner-accounts',[]);setAccounts(accs);syncR(accs);setNotify('✓ Pendaftaran '+nama+' berhasil! Silakan masuk.');setScreen('login');}});
  if(screen==='forgot')return h(ForgotPassword,{onBack:function(){setScreen('login');},onSuccess:function(){setNotify('✓ Password berhasil direset. Silakan masuk.');setScreen('login');}});
  if(screen==='login')return h('div',null,
    notify?h('div',{style:{padding:'10px 16px',background:'#E1F5EE',fontSize:13,color:'#0F6E56',textAlign:'center',borderBottom:'0.5px solid #9FE1CB'}},notify):null,
    h(Login,{onLogin:function(role,name){setUser({role:role,name:name});setScreen('app');setNotify('');},onRegister:function(){setScreen('register');setNotify('');},onForgot:function(){setScreen('forgot');setNotify('');}})
  );
  if(!user)return null;
  if(user.role==='runner')return h(RunnerApp,{name:user.name,config:config,trips:trips,onAdd:addTrip,onLogout:function(){setUser(null);setScreen('login');}});
  return h(AdminApp,{config:config,runners:runners,trips:trips,accounts:accounts,onUpdateRunnerStatus:updRunner,onSaveConfig:saveConfig,onSaveRunners:saveRunners,onLogout:function(){setUser(null);setScreen('login');}});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
</script>
</body>
</html>
